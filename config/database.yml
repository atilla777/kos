default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  pragmas:
    foreign_keys: true
    journal_mode: wal
    synchronous: full
    busy_timeout: 5000

development:
  <<: *default
  database: <%= ENV.fetch("KOS_DATABASE_PATH", "storage/development.sqlite3") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: <%= ENV.fetch("KOS_DATABASE_PATH", "storage/production.sqlite3") %>

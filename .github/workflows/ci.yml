name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
      - name: Install gems
        run: bundle install
      - name: Prepare database
        run: bin/rails db:prepare
      - name: Verify production boot
        run: RAILS_ENV=production SECRET_KEY_BASE_DUMMY=1 KOS_DATABASE_PATH=storage/production-ci.sqlite3 bin/rails runner "Rails.application.eager_load!"
      - name: Run checks
        run: mise run check

schema_version: "1"
id: quick-fix
version: 1.0.0
initial_status: implementation-planning
terminal_status: completed
statuses:
  - id: implementation-planning
    execution_mode: subagent
    instruction: .kos/workflows/quick-fix/1.0.0/steps/implementation-planning.md
    materials:
      - path: .kos/workflows/quick-fix/1.0.0/materials/planning-guidance.md
        media_type: text/markdown; charset=utf-8
    allowed_capabilities: []
    worktree: required
    repository_changes: allowed
    required_artifacts:
      - type: document
        cardinality: one
        subject: task
        allowed_states: [produced]
  - id: development
    execution_mode: subagent
    instruction: .kos/workflows/quick-fix/1.0.0/steps/development.md
    materials:
      - path: .kos/workflows/quick-fix/1.0.0/materials/development-guidance.md
        media_type: text/markdown; charset=utf-8
    allowed_capabilities: [kos-development]
    worktree: required
    repository_changes: allowed
    required_artifacts:
      - type: candidate
        cardinality: one
        subject: task
        allowed_states: [produced]
      - type: test
        cardinality: many
        subject: candidate
        allowed_states: [passed]
  - id: review
    execution_mode: subagent
    instruction: .kos/workflows/quick-fix/1.0.0/steps/review.md
    materials: []
    allowed_capabilities: [kos-review]
    worktree: required
    repository_changes: forbidden
    required_artifacts:
      - type: review
        cardinality: one
        subject: candidate
        allowed_states: [approved, changes_requested]
  - id: publication
    execution_mode: subagent
    instruction: .kos/workflows/quick-fix/1.0.0/steps/publication.md
    materials: []
    allowed_capabilities: [kos-publish]
    worktree: required
    repository_changes: forbidden
    required_artifacts:
      - type: publication
        cardinality: one
        subject: candidate
        allowed_states: [published]
transitions:
  - from: implementation-planning
    to: development
    conditions:
      - type: artifact-state
        artifact_type: document
        state: produced
  - from: development
    to: review
    conditions:
      - type: artifact-state
        artifact_type: candidate
        state: produced
      - type: artifact-state
        artifact_type: test
        state: passed
  - from: review
    to: development
    conditions:
      - type: artifact-state
        artifact_type: review
        state: changes_requested
  - from: review
    to: publication
    conditions:
      - type: artifact-state
        artifact_type: review
        state: approved
  - from: publication
    to: completed
    conditions:
      - type: artifact-state
        artifact_type: publication
        state: published
